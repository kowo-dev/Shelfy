@if (hasToken) {
  <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
    <div class="animate-rise-in stagger-1 mb-3 flex flex-col gap-4">
      <h1 class="heading-auth">
        {{ 'auth.reset_password' | translate }}
      </h1>
      <p class="text-text-muted text-base">{{ 'auth.reset_password_desc' | translate }}</p>
    </div>

    <shelfy-input
      formControlName="newPassword"
      type="password"
      [label]="'auth.new_password' | translate"
      [error]="newPasswordError()"
      prefixIcon="lock"
      [passwordToggle]="true"
      class="animate-rise-in stagger-2"
    />

    <shelfy-input
      formControlName="confirmPassword"
      type="password"
      [label]="'auth.confirm_password' | translate"
      [error]="confirmPasswordError()"
      prefixIcon="lock"
      [passwordToggle]="true"
      class="animate-rise-in stagger-3"
    />

    <div class="animate-rise-in stagger-4">
      <shelfy-button type="submit" variant="primary" [loading]="loading()" [block]="true">
        {{ 'auth.reset_password' | translate }}
      </shelfy-button>
    </div>
  </form>
} @else {
  <div class="animate-rise-in flex flex-col items-start gap-4">
    <h1 class="heading-auth">
      {{ 'auth.reset_password' | translate }}
    </h1>
    <p class="text-text-muted text-base">{{ 'auth.errors.reset_token_invalid' | translate }}</p>
    <a routerLink="/auth/forgot-password" [class]="linkButton">
      {{ 'auth.forgot_password' | translate }}
    </a>
  </div>
}
