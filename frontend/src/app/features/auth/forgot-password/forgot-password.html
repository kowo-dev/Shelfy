@if (!submitted()) {
  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
    <shelfy-auth-form-head title="auth.forgot_password" description="auth.forgot_password_desc" />

    <shelfy-input
      formControlName="email"
      type="email"
      [label]="'auth.email' | translate"
      [error]="emailError()"
      prefixIcon="mail"
      class="animate-rise-in stagger-2"
    />

    <div class="animate-rise-in stagger-3">
      <shelfy-button type="submit" variant="primary" [loading]="loading()" [block]="true">
        {{ 'auth.send_reset_link' | translate }}
      </shelfy-button>
    </div>

    <p class="text-text-muted animate-rise-in stagger-4 mt-2 text-base">
      <a
        routerLink="/auth/login"
        class="text-text font-medium underline decoration-white/30 underline-offset-4 transition-colors hover:decoration-white"
      >
        {{ 'auth.back_to_sign_in' | translate }}
      </a>
    </p>
  </form>
} @else {
  <div class="animate-rise-in flex flex-col items-start gap-4">
    <span [class]="mark" aria-hidden="true"><shelfy-icon name="mail" size="32" /></span>
    <h1 class="heading-auth">
      {{ 'auth.forgot_password' | translate }}
    </h1>
    <p class="text-text-muted text-base">{{ 'auth.reset_link_sent' | translate }}</p>
    <a routerLink="/auth/login" [class]="linkButton">
      {{ 'auth.back_to_sign_in' | translate }}
    </a>
  </div>
}
