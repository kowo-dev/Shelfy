@if (images().length > 0) {
  <shelfy-shelf-section rail="w" [title]="'media.visuals' | translate">
    @for (image of images(); track image) {
      <div class="min-w-0">
        <ng-container
          [ngTemplateOutlet]="visual"
          [ngTemplateOutletContext]="{ $implicit: image }"
        />
      </div>
    }
  </shelfy-shelf-section>
}

<ng-template #visual let-image>
  <div class="group/card relative">
    <div class="relative">
      <button
        type="button"
        class="bg-surface-raised relative isolate block aspect-video w-full cursor-zoom-in overflow-hidden rounded-lg"
        [class]="cardSurface"
        [attr.aria-label]="'media.open_image' | translate"
        (click)="imageSelected.emit(image)"
      >
        <img [src]="image" alt="" loading="lazy" class="size-full object-cover" />
      </button>
    </div>
  </div>
</ng-template>
