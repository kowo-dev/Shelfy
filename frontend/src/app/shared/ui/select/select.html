<ng-template #menu>
  @if (open()) {
    <div
      [class]="panelClasses()"
      role="listbox"
      [attr.aria-labelledby]="id"
      animate.leave="animate-pop-out"
    >
      @for (option of options(); track option.value) {
        <button
          type="button"
          role="option"
          [class]="menuItem()"
          [class.text-text!]="isSelected(option.value)"
          [class.bg-white/8]="isSelected(option.value)"
          [attr.aria-selected]="isSelected(option.value)"
          (click)="selectValue(option.value)"
        >
          @if (option.icon) {
            <shelfy-icon [name]="option.icon" size="sm" />
          }
          {{ option.label }}
          @if (isSelected(option.value)) {
            <shelfy-icon name="check" size="sm" class="text-accent ml-auto" />
          }
        </button>
      }
    </div>
  }
</ng-template>

@if (variant() === 'default') {
  <div class="form-field">
    @if (label()) {
      <label [for]="id" class="form-label">{{ label() }}</label>
    }
    <div class="relative">
      <button
        type="button"
        [id]="id"
        [disabled]="isDisabled()"
        [class]="triggerClasses()"
        aria-haspopup="listbox"
        [attr.aria-expanded]="open()"
        [attr.aria-invalid]="error() ? 'true' : null"
        (click)="toggleOpen()"
      >
        @if (selectedOption()?.icon; as icon) {
          <shelfy-icon [name]="icon" size="sm" />
        }
        <span class="min-w-0 flex-1 truncate">{{ selectedLabel() }}</span>
      </button>
      <span
        class="text-text-subtle pointer-events-none absolute top-1/2 right-3 -translate-y-1/2"
        [class]="chevron"
        [class.rotate-180]="open()"
      >
        <shelfy-icon name="chevronDown" size="sm" />
      </span>
      <ng-container [ngTemplateOutlet]="menu" />
    </div>
    @if (error()) {
      <span class="form-error">{{ error() }}</span>
    } @else if (hint()) {
      <span class="form-hint">{{ hint() }}</span>
    }
  </div>
} @else {
  <div class="relative h-full">
    <button
      type="button"
      [id]="id"
      [disabled]="isDisabled()"
      [class]="triggerClasses()"
      aria-haspopup="listbox"
      [attr.aria-expanded]="open()"
      (click)="toggleOpen()"
    >
      @if (prefix()) {
        <span class="max-md:hidden">{{ prefix() }}</span>
      }
      @if (selectedOption()?.icon; as icon) {
        <shelfy-icon [name]="icon" size="sm" />
      }
      <span class="min-w-0 flex-1 truncate" [class.text-text]="!!prefix()">{{
        selectedLabel()
      }}</span>
      <span [class]="chevron" [class.rotate-180]="open()">
        <shelfy-icon name="chevronDown" size="sm" />
      </span>
    </button>
    <ng-container [ngTemplateOutlet]="menu" />
  </div>
}
