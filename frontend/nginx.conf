server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ~ ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-cache";
  }

  location ~ ^/(chunk|main|polyfills|styles)-[^/]+\.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
