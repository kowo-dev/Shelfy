name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - name: Check the tag is on main and passed CI
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$TAG does not point to a commit on main" >&2; exit 1; }
          passed="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          [ "$passed" -gt 0 ] || { echo "CI has not passed on $GITHUB_SHA yet" >&2; exit 1; }
      - name: Write the release notes
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*.*.*' "$TAG^" 2>/dev/null || true)"
          range="${previous:+$previous..}$TAG"
          subjects="$(git log --no-merges --format=%s "$range")"
          section() {
            local lines
            lines="$(grep -E "$2" <<< "$subjects" | sed -E 's/^[a-z]+(\(([^)]*)\))?!?: /- \2: /; s/^- : /- /' || true)"
            if [ -n "$lines" ]; then printf '\n## %s\n\n%s\n' "$1" "$lines"; fi
          }
          {
            if [ "$(git cat-file -t "$TAG")" = tag ]; then
              git tag -l --format='%(contents:body)' "$TAG" | sed '/-----BEGIN PGP/,$d'
            fi
            section 'Breaking changes' '^[a-z]+(\([^)]*\))?!: '
            section 'Features' '^feat(\([^)]*\))?: '
            section 'Fixes' '^fix(\([^)]*\))?: '
            section 'Performance' '^perf(\([^)]*\))?: '
            if [ -n "$previous" ]; then
              printf '\n**Full changes**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$previous" "$TAG"
            fi
          } > notes.md
          cat notes.md
      - name: Publish the release
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --latest
            git push origin "$GITHUB_SHA:refs/heads/stable"
          fi
